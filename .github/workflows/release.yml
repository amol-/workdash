name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/ruff.yml

  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match format N.N.N"
            exit 1
          fi

      - name: Check version matches tag
        run: |
          FILE_VERSION=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          if [ "$GITHUB_REF_NAME" != "$FILE_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match version in pyproject.toml ('$FILE_VERSION')"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
