    <meta name="twitter:image" content="https://alessandro.molina.fyi/workdash/img/workdash.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />

  </head>
  <body>
    <header>
      <div class="container">
        <div class="brand"><span class="mark">&#9889;</span> <a href="index.html">workdash</a></div>
        <nav aria-label="Main navigation">
          <a href="work.html">Work</a> &middot;
          <a href="review.html">Review</a> &middot;
          <a href="agentic.html">Agentic loop</a> &middot;
          <a href="control.html">Automation</a> &middot;
          <a href="index.html#install">Install</a>
        </nav>
      </div>
    </header>

    <section id="features">
      <div class="container">
        <h2>One key, one action</h2>
        <div class="features">
          <div class="feature">
            <h3><span class="kbd">d</span>Dispatch</h3>
            <p>
              Start an autodispatch session that works through the selected
              issue's ready tasks and reviews the pull requests it opens.
            </p>
          </div>
        </div>
      </div>
    </section>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" aria-label="Close">&times;</button>
      <img alt="" />
    </div>

    <footer>
      <div class="container">
        <p>
          <a href="https://github.com/amol-/workdash">Source</a>
          &middot;
          <a href="https://github.com/amol-/workdash/blob/main/features/"
            >Product spec (BDD)</a
          >
          &middot;
          <a href="https://github.com/amol-/workdash/blob/main/LICENSE">GPL-3.0</a>
        </p>
        <p>&copy; Alessandro Molina</p>
      </div>
    </footer>

    <script>
      (function () {
        var lightbox = document.getElementById("lightbox");
        var lightboxImg = lightbox.querySelector("img");
        var closeBtn = lightbox.querySelector(".lightbox-close");

        function open(src, alt) {
          lightboxImg.src = src;
          lightboxImg.alt = alt || "";
          lightbox.classList.add("open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

        function close() {
          lightbox.classList.remove("open");
          lightbox.setAttribute("aria-hidden", "true");
          lightboxImg.src = "";
          document.body.style.overflow = "";
        }

        document.querySelectorAll(".tour-shot").forEach(function (el) {
          el.addEventListener("click", function () {
            var full = el.getAttribute("data-full");
            var img = el.querySelector("img");
            open(full, img ? img.alt : "");
          });
        });

        lightbox.addEventListener("click", function (e) {
          if (e.target === lightbox || e.target === closeBtn) close();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && lightbox.classList.contains("open")) close();
        });
      })();
    </script>
  </body>
</html>
